<!DOCTYPE html>
<html lang="fr" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitApp Pro</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <link rel="manifest" href="./manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .active-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.35); }
    @keyframes toastIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-toast { animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden relative">

  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-11/12 max-w-sm"></div>

  <!-- Header Bar -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-slate-950 border border-blue-500/40 flex items-center justify-center p-1.5 shadow-lg active-glow">
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <path d="M30 30 h10 v40 h-10 z M60 30 h10 v40 h-10 z M20 40 h10 v20 h-10 z M70 40 h10 v20 h-10 z M40 46 h20 v8 h-20 z" fill="#2563eb"/>
          <circle cx="50" cy="50" r="6" fill="#10b981"/>
        </svg>
      </div>
      <div>
        <h1 class="font-extrabold text-sm tracking-tight leading-tight text-white flex items-center gap-1">
          FITAPP <span class="text-[9px] font-bold px-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PRO</span>
        </h1>
        <!-- Sélection Utilisateur / Surnom -->
        <select id="user-select" onchange="changeUser(this.value)" class="bg-slate-950 border border-slate-700 text-blue-400 text-[11px] font-bold rounded px-1.5 py-0.5 outline-none mt-0.5">
          <option value="">Chargement...</option>
        </select>
      </div>
    </div>

    <div class="flex items-center space-x-1.5">
      <button onclick="switchView('workout')" id="nav-btn-workout" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white flex items-center gap-1 shadow">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Séances
      </button>
      <button onclick="switchView('chart')" id="nav-btn-chart" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-1">
        <i data-lucide="line-chart" class="w-3.5 h-3.5"></i> Progrès
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">
    <div id="view-workout" class="space-y-5">
      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Programme Semaine</h2>
          <button onclick="fetchSheetData()" class="text-[10px] bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-1 rounded-lg font-bold flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Synchroniser
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2" id="session-tabs"></div>
      </section>

      <!-- Rest Timer -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <i data-lucide="timer" class="w-4 h-4 text-blue-400"></i>
            <h3 class="font-bold text-sm text-white">Minuteur de Repos</h3>
          </div>
          <div class="flex items-center space-x-1">
            <button onclick="setTimerPreset(45)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">45s</button>
            <button onclick="setTimerPreset(60)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">60s</button>
            <button onclick="setTimerPreset(90)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-blue-600/30 text-blue-300 border border-blue-500/30">90s</button>
            <button onclick="setTimerPreset(120)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">120s</button>
          </div>
        </div>

        <div class="flex items-center justify-between bg-slate-950/80 rounded-xl p-3 border border-slate-800">
          <div class="flex items-center space-x-4">
            <span id="timer-display" class="font-mono font-black text-xl text-white">01:30</span>
            <p id="timer-status-text" class="text-xs font-medium text-slate-400">Prêt pour la pause</p>
          </div>

          <div class="flex items-center space-x-2">
            <button id="timer-toggle-btn" onclick="toggleRestTimer()" class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shadow-lg">
              <i data-lucide="play" class="w-5 h-5"></i>
            </button>
            <button onclick="resetRestTimer()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Exercices -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span id="session-badge" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
            <h2 id="session-title" class="font-black text-lg text-white">Sélectionnez une séance</h2>
          </div>
        </div>

        <div id="exercise-list" class="space-y-4"></div>
      </section>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYs8RZfGX62aAIj0ZZ7slGkZ2xFQ9lnWOE7ezFcQdKqCQkxbY34U8e6CN1KNjsOvuY/exec";

    let currentUser = localStorage.getItem('fitapp_user') || "";
    let rawExercises = [];
    let sessionsList = [];
    let activeSessionIndex = null;
    let restTimeTotal = 90, restTimeRemaining = 90, restTimerInterval = null, isRestTimerRunning = false;

    window.addEventListener('DOMContentLoaded', () => {
      fetchSheetData();
    });

    function showToast(msg, type = "info") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `bg-slate-800 text-slate-100 border border-slate-700 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-toast`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function fetchSheetData() {
      fetch(GOOGLE_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          populateUserSelect(data.users);
          rawExercises = data.exercises || [];
          buildProgramForCurrentUser();
        })
        .catch(err => {
          console.error(err);
          showToast("Erreur de chargement des données", "error");
        });
    }

    function populateUserSelect(users) {
      const select = document.getElementById('user-select');
      select.innerHTML = users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
      if (!currentUser && users.length > 0) {
        currentUser = users[0];
        localStorage.setItem('fitapp_user', currentUser);
      }
    }

    function changeUser(user) {
      currentUser = user;
      localStorage.setItem('fitapp_user', currentUser);
      buildProgramForCurrentUser();
      showToast(`Utilisateur : ${currentUser}`);
    }

    function buildProgramForCurrentUser() {
      const userEx = rawExercises.filter(e => !e.user || e.user.toLowerCase() === currentUser.toLowerCase());
      
      const grouped = {};
      userEx.forEach(ex => {
        if (!grouped[ex.seance]) grouped[ex.seance] = [];
        grouped[ex.seance].push(ex);
      });

      sessionsList = Object.keys(grouped).map((seanceName, idx) => ({
        id: "s" + idx,
        title: seanceName,
        badgeColor: "bg-blue-500",
        exercises: grouped[seanceName]
      }));

      renderTabs();
      if (sessionsList.length > 0) {
        switchSession(0);
      } else {
        document.getElementById('exercise-list').innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Aucun exercice trouvé pour ${currentUser}.</p>`;
      }
    }

    function renderTabs() {
      const container = document.getElementById('session-tabs');
      container.innerHTML = sessionsList.map((s, idx) => `
        <button onclick="switchSession(${idx})" class="text-left p-3 rounded-xl border transition-all flex flex-col justify-between ${idx === activeSessionIndex ? 'bg-slate-900 border-blue-500/80 active-glow' : 'bg-slate-900/60 border-slate-800'}">
          <div class="font-bold text-xs text-white truncate">${s.title}</div>
        </button>
      `).join('');
    }

    function switchSession(idx) {
      activeSessionIndex = idx;
      renderTabs();
      loadSession(idx);
    }

    function loadSession(idx) {
      const session = sessionsList[idx];
      if (!session) return;
      document.getElementById('session-title').innerText = session.title;

      const container = document.getElementById('exercise-list');
      container.innerHTML = session.exercises.map((ex) => {
        const savedData = getSavedLogs(ex.id);

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-black text-base text-white">${ex.name}</h3>
                <p class="text-xs text-blue-400 font-medium">${ex.sets} x ${ex.reps} reps • Pause: ${ex.restSec}s</p>
              </div>
            </div>
            
            <div class="space-y-2 pt-1">
              <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center px-1">
                <span class="col-span-2">Série</span>
                <span class="col-span-3">Poids (kg)</span>
                <span class="col-span-2">Reps</span>
                <span class="col-span-3">Ressenti</span>
                <span class="col-span-2">Valider</span>
              </div>
              ${Array.from({ length: ex.sets }).map((_, setIdx) => {
                const setLog = (savedData.sets && savedData.sets[setIdx]) ? savedData.sets[setIdx] : {};
                const isDone = (setLog.done === true);
                const disabledAttr = isDone ? 'disabled' : '';
                const disabledClass = isDone ? 'opacity-50 bg-slate-950 border-slate-800' : 'bg-slate-900 border-slate-700';

                return `
                  <div class="grid grid-cols-12 gap-1.5 items-center bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
                    <span class="col-span-2 text-center text-xs font-bold text-slate-400">#${setIdx + 1}</span>
                    <div class="col-span-3">
                      <input type="number" id="weight-${ex.id}-${setIdx}" value="${setLog.weight \vert{}\vert{} ''}" placeholder="kg" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1.5 py-1 text-center outline-none border ${disabledClass}">
                    </div>
                    <div class="col-span-2">
                      <input type="number" id="reps-${ex.id}-${setIdx}" value="${setLog.reps \vert{}\vert{} ex.reps}" placeholder="reps" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1 py-1 text-center outline-none border ${disabledClass}">
                    </div>
                    <div class="col-span-3">
                      <input type="text" id="comment-${ex.id}-${setIdx}" value="${setLog.comment \vert{}\vert{} ''}" placeholder="Note..." ${disabledAttr} class="w-full text-slate-300 text-[10px] rounded-lg px-1.5 py-1 outline-none border ${disabledClass}">
                    </div>
                    <div class="col-span-2 flex justify-center">
                      <button onclick="toggleSetDone('${ex.id}', '${ex.name}', ${setIdx},${ex.restSec})" id="btn-check-${ex.id}-${setIdx}" class="w-7 h-7 rounded-lg flex items-center justify-center transition ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-500'}">
                        ✓
                      </button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }).join('');
      if (typeof lucide !== 'undefined') { lucide.createIcons(); }
    }

    function getSavedLogs(exId) {
      const data = localStorage.getItem(`fitapp_log_${currentUser}_${exId}`);
      return data ? JSON.parse(data) : {};
    }

    function sendToGoogleSheets(payload) {
      if (!GOOGLE_SCRIPT_URL) return;
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(err => console.error(err));
    }

    function toggleSetDone(exId, exName, setIdx, restSec) {
      const saved = getSavedLogs(exId);
      if (!saved.sets) saved.sets = {};

      const weightEl = document.getElementById(`weight-${exId}-${setIdx}`);
      const repsEl = document.getElementById(`reps-${exId}-${setIdx}`);
      const commentEl = document.getElementById(`comment-${exId}-${setIdx}`);

      const weightVal = weightEl.value;
      const repsVal = repsEl.value;
      const commentVal = commentEl.value;
      const nextDone = (saved.sets[setIdx]?.done !== true);

      saved.sets[setIdx] = { weight: weightVal, reps: repsVal, comment: commentVal, done: nextDone };
      localStorage.setItem(`fitapp_log_${currentUser}_${exId}`, JSON.stringify(saved));

      const btn = document.getElementById(`btn-check-${exId}-${setIdx}`);

      if (nextDone) {
        btn.className = "w-7 h-7 rounded-lg flex items-center justify-center transition bg-emerald-500 text-white";
        [weightEl, repsEl, commentEl].forEach(el => { el.disabled = true; el.classList.add('opacity-50'); });
        showToast("Série enregistrée !");

        sendToGoogleSheets({
          action: "CHECK",
          user: currentUser,
          session: sessionsList[activeSessionIndex].title,
          exercise: exName,
          set: setIdx + 1,
          weight: weightVal,
          reps: repsVal,
          comments: commentVal
        });

        if (restSec > 0) { setTimerPreset(restSec); startRestTimer(); }
      } else {
        btn.className = "w-7 h-7 rounded-lg flex items-center justify-center transition bg-slate-800 text-slate-500";
        [weightEl, repsEl, commentEl].forEach(el => { el.disabled = false; el.classList.remove('opacity-50'); });
        showToast("Série supprimée !");

        sendToGoogleSheets({
          action: "UNCHECK",
          user: currentUser,
          session: sessionsList[activeSessionIndex].title,
          exercise: exName,
          set: setIdx + 1
        });
      }
    }

    function setTimerPreset(sec) { restTimeTotal = sec; restTimeRemaining = sec; updateTimerDisplay(); }
    function updateTimerDisplay() {
      const mins = Math.floor(restTimeRemaining / 60), secs = restTimeRemaining % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    function toggleRestTimer() { if (isRestTimerRunning) pauseRestTimer(); else startRestTimer(); }
    function startRestTimer() {
      if (isRestTimerRunning) clearInterval(restTimerInterval);
      isRestTimerRunning = true;
      document.getElementById('timer-status-text').innerText = "Repos en cours...";
      restTimerInterval = setInterval(() => {
        if (restTimeRemaining > 0) { restTimeRemaining--; updateTimerDisplay(); } 
        else { pauseRestTimer(); document.getElementById('timer-status-text').innerText = "Temps écoulé !"; }
      }, 1000);
    }
    function pauseRestTimer() { isRestTimerRunning = false; clearInterval(restTimerInterval); }
    function resetRestTimer() { pauseRestTimer(); restTimeRemaining = restTimeTotal; updateTimerDisplay(); }
    function switchView(view) {}
  </script>
</body>
</html>
