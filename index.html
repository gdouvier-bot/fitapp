<!DOCTYPE html>
<html lang="fr" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitApp Pro</title>
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Ajout de Chart.js pour les graphiques -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; user-select: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .active-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.35); }
    @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-toast { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden relative">

  <!-- Toasts -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-11/12 max-w-sm"></div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-slate-950 border border-blue-500/40 flex items-center justify-center p-1.5 shadow-lg active-glow">
        <svg viewBox="0 0 100 100" class="w-full h-full"><path d="M30 30 h10 v40 h-10 z M60 30 h10 v40 h-10 z M20 40 h10 v20 h-10 z M70 40 h10 v20 h-10 z M40 46 h20 v8 h-20 z" fill="#2563eb"/><circle cx="50" cy="50" r="6" fill="#10b981"/></svg>
      </div>
      <div>
        <h1 class="font-extrabold text-sm text-white">FITAPP PRO</h1>
        <select id="user-select" onchange="changeUser(this.value)" class="bg-slate-950 border border-slate-700 text-blue-400 text-[11px] font-bold rounded px-2 py-0.5 mt-0.5 shadow-sm">
          <option value="">Chargement...</option>
        </select>
      </div>
    </div>
    <button onclick="fetchSheetData()" id="sync-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-1.5 border border-slate-700 transition">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> <span>Sync</span>
    </button>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24 relative" id="main-content">
    
    <!-- VUE : ENTRAINEMENT -->
    <div id="view-workout" class="space-y-5 block">
      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Programme Semaine</h2>
        </div>
        <div class="grid grid-cols-2 gap-2" id="session-tabs"></div>
      </section>

      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <i data-lucide="timer" class="w-4 h-4 text-blue-400"></i>
            <h3 class="font-bold text-sm text-white">Minuteur</h3>
          </div>
          <div class="flex items-center space-x-1">
            <button onclick="setTimerPreset(45)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700">45s</button>
            <button onclick="setTimerPreset(60)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700">60s</button>
            <button onclick="setTimerPreset(90)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700">90s</button>
          </div>
        </div>
        <div class="flex items-center justify-between bg-slate-950/80 rounded-xl p-3 border border-slate-800">
          <span id="timer-display" class="font-mono font-black text-xl text-white">01:30</span>
          <div class="flex items-center space-x-2">
            <button id="timer-toggle-btn" onclick="toggleRestTimer()" class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-lg transition"><i data-lucide="play" class="w-5 h-5"></i></button>
            <button onclick="resetRestTimer()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center transition hover:bg-slate-700"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
          </div>
        </div>
      </section>

      <section class="space-y-3" id="exercise-container">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span id="session-badge" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
            <h2 id="session-title" class="font-black text-lg text-white">Aucune séance</h2>
          </div>
        </div>
        <div id="exercise-list" class="space-y-4"></div>
      </section>
    </div>

    <!-- VUE : PROGRESSION -->
    <div id="view-stats" class="space-y-5 hidden">
      <section>
        <div class="flex items-center space-x-2 mb-4">
          <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i>
          <h2 class="font-black text-lg text-white">Progression</h2>
        </div>
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Choisir un exercice</label>
          <select id="chart-exercise-select" onchange="renderChart()" class="w-full bg-slate-950 border border-slate-700 text-white text-sm font-semibold rounded-xl px-3 py-2.5 outline-none mb-4 focus:border-blue-500 transition">
            <option value="">Sélectionnez...</option>
          </select>
          
          <div class="relative h-64 w-full bg-slate-950/50 rounded-xl border border-slate-800 p-2 flex items-center justify-center">
            <canvas id="progressionChart"></canvas>
            <p id="no-data-msg" class="absolute text-slate-500 text-xs font-semibold hidden">Pas assez de données</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- NAVIGATION BAS -->
  <nav class="fixed bottom-0 w-full bg-slate-900 border-t border-slate-800 pb-safe z-40">
    <div class="flex justify-around items-center p-2">
      <button onclick="switchView('workout')" id="nav-workout" class="flex flex-col items-center p-2 text-blue-500 w-1/2">
        <i data-lucide="dumbbell" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Séance</span>
      </button>
      <button onclick="switchView('stats')" id="nav-stats" class="flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 w-1/2">
        <i data-lucide="bar-chart-3" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Stats</span>
      </button>
    </div>
  </nav>

  <script>
    // URL DE TON SCRIPT APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGcQdRgnQltX9OFVpSNg6VLkVh53NVqLznPfOklHwRO9IXRNuhx4EB_itLyLmhoBQi/exec";
    
    let currentUser = localStorage.getItem('fitapp_user') || "";
    let rawExercises = JSON.parse(localStorage.getItem('fitapp_raw_exercises')) || [];
    let allUsers = JSON.parse(localStorage.getItem('fitapp_all_users')) || [];
    let journalLogs = JSON.parse(localStorage.getItem('fitapp_journal_logs')) || [];
    
    let sessionsList = [];
    let activeSessionIndex = null;
    let restTimeTotal = 90, restTimeRemaining = 90, restTimerInterval = null, isRestTimerRunning = false;
    let chartInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      if (allUsers.length > 0 && rawExercises.length > 0) {
        populateUserSelect(allUsers);
        buildProgramForCurrentUser();
      }
      fetchSheetData();
    });

    function showToast(msg, type="info") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const color = type === "error" ? "bg-red-600 border-red-500" : type === "success" ? "bg-emerald-600 border-emerald-500" : "bg-slate-800 border-slate-700";
      toast.className = `${color} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-toast`;
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // --- SYSTEME DE VUES (Onglets du bas) ---
    function switchView(view) {
      if (view === 'workout') {
        document.getElementById('view-workout').classList.remove('hidden');
        document.getElementById('view-stats').classList.add('hidden');
        document.getElementById('nav-workout').className = "flex flex-col items-center p-2 text-blue-500 w-1/2";
        document.getElementById('nav-stats').className = "flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 w-1/2 transition";
      } else {
        document.getElementById('view-workout').classList.add('hidden');
        document.getElementById('view-stats').classList.remove('hidden');
        document.getElementById('nav-stats').className = "flex flex-col items-center p-2 text-emerald-500 w-1/2";
        document.getElementById('nav-workout').className = "flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 w-1/2 transition";
        populateChartDropdown();
      }
    }

    // CHARGEMENT VIA JSONP
    function fetchSheetData() {
      const btn = document.getElementById('sync-btn');
      if (btn) btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const script = document.createElement('script');
      script.src = GOOGLE_SCRIPT_URL + "?callback=onGoogleDataLoaded&t=" + Date.now();
      document.body.appendChild(script);
      
      script.onload = () => script.remove();
      script.onerror = () => {
         if (btn) btn.innerHTML = `<i data-lucide="wifi-off" class="w-3.5 h-3.5 text-red-400"></i>`;
         alert("Impossible de joindre Google Sheets.");
      };
    }

    function onGoogleDataLoaded(data) {
      const btn = document.getElementById('sync-btn');
      if (btn) btn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> <span>Sync</span>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();

      if (data.error) {
        alert("Erreur Google : " + data.error);
        return;
      }

      allUsers = data.users || [];
      rawExercises = data.exercises || [];
      journalLogs = data.logs || []; // Les logs pour les graphiques !
      
      localStorage.setItem('fitapp_all_users', JSON.stringify(allUsers));
      localStorage.setItem('fitapp_raw_exercises', JSON.stringify(rawExercises));
      localStorage.setItem('fitapp_journal_logs', JSON.stringify(journalLogs));

      populateUserSelect(allUsers);
      buildProgramForCurrentUser();
      populateChartDropdown();
      showToast("Synchronisation réussie !", "success");
    }

    function populateUserSelect(users) {
      const select = document.getElementById('user-select');
      if (users.length === 0) users = ["Doudou"];
      select.innerHTML = users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
      if (!currentUser || !users.includes(currentUser)) {
        currentUser = users[0];
        localStorage.setItem('fitapp_user', currentUser);
      }
    }

    function changeUser(user) {
      currentUser = user;
      localStorage.setItem('fitapp_user', currentUser);
      buildProgramForCurrentUser();
      populateChartDropdown();
      showToast(`Profil chargé : ${currentUser}`);
    }

    // --- GRAPHIQUES (CHART.JS) ---
    function populateChartDropdown() {
      const select = document.getElementById('chart-exercise-select');
      // Obtenir la liste des exercices uniques faits par cet utilisateur dans l'historique
      const userLogs = journalLogs.filter(log => log.user.toLowerCase() === currentUser.toLowerCase());
      const uniqueEx = [...new Set(userLogs.map(log => log.exercise))].sort();
      
      select.innerHTML = '<option value="">Sélectionnez un exercice...</option>' + 
                         uniqueEx.map(ex => `<option value="${ex}">${ex}</option>`).join('');
      
      if(chartInstance) chartInstance.destroy();
      document.getElementById('no-data-msg').classList.add('hidden');
    }

    function renderChart() {
      const selectedEx = document.getElementById('chart-exercise-select').value;
      if (!selectedEx) return;

      // Récupère l'historique de l'utilisateur pour cet exercice précis
      const userLogs = journalLogs.filter(log => log.user.toLowerCase() === currentUser.toLowerCase() && log.exercise === selectedEx);
      
      // On va grouper par date et trouver le max (Performance du jour)
      const dailyPerf = {};
      userLogs.forEach(log => {
        const date = log.date.substring(0, 10); // Extrait jj/mm/yyyy
        // On nettoie la valeur (ex: retire les 'kg', 'km' pour n'avoir que des chiffres)
        let val = parseFloat(String(log.weight).replace(/[^0-9.,]/g, '').replace(',', '.'));
        if (isNaN(val)) val = parseFloat(String(log.reps).replace(/[^0-9.,]/g, '').replace(',', '.')); // Si pas de poids, on prend l'autre case
        
        if (!isNaN(val)) {
          if (!dailyPerf[date] || val > dailyPerf[date]) {
            dailyPerf[date] = val; // On garde le max du jour
          }
        }
      });

      const dates = Object.keys(dailyPerf);
      const dataPoints = Object.values(dailyPerf);

      if (dates.length === 0) {
        if(chartInstance) chartInstance.destroy();
        document.getElementById('no-data-msg').classList.remove('hidden');
        return;
      }
      
      document.getElementById('no-data-msg').classList.add('hidden');

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('progressionChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{
            label: 'Performance Max',
            data: dataPoints,
            borderColor: '#34d399', // Emerald 400
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            borderWidth: 3,
            pointBackgroundColor: '#10b981',
            pointBorderColor: '#fff',
            pointRadius: 4,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8', maxTicksLimit: 5 }
            }
          }
        }
      });
    }

    // --- LE RESTE (WORKOUT) ---
    function buildProgramForCurrentUser() {
      const userEx = rawExercises.filter(e => e.user.toLowerCase() === currentUser.toLowerCase());
      const grouped = {};
      userEx.forEach(ex => {
        if (!grouped[ex.seance]) grouped[ex.seance] = [];
        grouped[ex.seance].push(ex);
      });

      sessionsList = Object.keys(grouped).map((seanceName, idx) => ({ id: "s" + idx, title: seanceName, exercises: grouped[seanceName] }));
      renderTabs();
      if (sessionsList.length > 0) switchSession(activeSessionIndex !== null && activeSessionIndex < sessionsList.length ? activeSessionIndex : 0);
    }

    function renderTabs() {
      const container = document.getElementById('session-tabs');
      container.innerHTML = sessionsList.map((s, idx) => `
        <button onclick="switchSession(${idx})" class="text-left p-3 rounded-xl border transition-all flex flex-col justify-between ${idx === activeSessionIndex ? 'bg-slate-900 border-blue-500/80 active-glow' : 'bg-slate-900/60 border-slate-800'}">
          <div class="font-bold text-xs text-white truncate">${s.title.replace(currentUser + " - ", "")}</div>
        </button>
      `).join('');
    }

    function switchSession(idx) {
      activeSessionIndex = idx;
      renderTabs();
      loadSession(idx);
    }

    function loadSession(idx) {
      const session = sessionsList[idx];
      if (!session) return;
      document.getElementById('session-title').innerText = session.title;
      const container = document.getElementById('exercise-list');
      
      let html = '';
      session.exercises.forEach((ex) => {
        const savedData = getSavedLogs(ex.id);
        const safeName = ex.name.replace(/'/g, "\\'"); 
        
        const exType = (ex.type || "Poids").trim().toLowerCase();
        let head1 = "Poids", head2 = "Reps", ph1 = "kg", ph2 = "reps", isCardio = false;

        if (exType === "durée" || exType === "duree") {
          head1 = "Temps"; ph1 = "ex: 30s"; head2 = "Dist."; ph2 = "km/m"; isCardio = true;
        } else if (exType === "km") {
          head1 = "Dist."; ph1 = "ex: 5km"; head2 = "Temps"; ph2 = "ex: 20m"; isCardio = true;
        } else if (exType === "pdc") {
          head1 = "Lest"; ph1 = "+kg"; head2 = "Reps"; ph2 = "reps";
        }

        const totalSets = isCardio ? 1 : ex.sets;
        let setsHtml = '';
        for (let setIdx = 0; setIdx < totalSets; setIdx++) {
          const setLog = (savedData.sets && savedData.sets[setIdx]) ? savedData.sets[setIdx] : {};
          const isDone = (setLog.done === true);
          
          const disabledAttr = isDone ? 'disabled' : '';
          const disClass = isDone ? 'opacity-50 bg-slate-950 border-slate-800' : 'bg-slate-900 border-slate-700 focus:border-blue-500';
          const btnClass = isDone ? 'bg-emerald-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 hover:text-slate-200';
          
          const val1 = setLog.weight || '';
          const val2 = setLog.reps || (!isCardio ? ex.reps : ''); 
          const commentVal = setLog.comment || '';

          setsHtml += `
            <div class="grid grid-cols-12 gap-1.5 items-center bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
              <span class="col-span-2 text-center text-xs font-bold text-slate-400">${isCardio ? 'Obj.' : '#' + (setIdx + 1)}</span>
              <div class="col-span-3"><input type="text" id="weight-${ex.id}-${setIdx}" value="${val1}" placeholder="${ph1}" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1 py-1 text-center outline-none border transition ${disClass}"></div>
              <div class="col-span-2"><input type="text" id="reps-${ex.id}-${setIdx}" value="${val2}" placeholder="${ph2}" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1 py-1 text-center outline-none border transition ${disClass}"></div>
              <div class="col-span-3"><input type="text" id="comment-${ex.id}-${setIdx}" value="${commentVal}" placeholder="Note" ${disabledAttr} class="w-full text-slate-300 text-[10px] rounded-lg px-1 py-1 outline-none border transition ${disClass}"></div>
              <div class="col-span-2 flex justify-center"><button onclick="toggleSetDone('${ex.id}', '${safeName}', ${setIdx}, ${ex.restSec})" class="w-7 h-7 rounded-lg flex items-center justify-center font-bold transition ${btnClass}">✓</button></div>
            </div>`;
        }

        const seriesText = isCardio ? `<span class="text-amber-400">Objectif: ${ex.reps}</span>` : `${ex.sets} séries`;
        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-md">
            <div>
              <div class="flex justify-between items-start">
                <h3 class="font-black text-base text-white">${ex.name}</h3>
                <span class="text-[9px] font-bold uppercase tracking-wider bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${ex.type || 'Poids'}</span>
              </div>
              <p class="text-xs text-blue-400 font-medium mt-0.5">${seriesText} • Pause: ${ex.restSec}s</p>
            </div>
            <div class="space-y-2 pt-1">
              <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center px-1">
                <span class="col-span-2">Série</span><span class="col-span-3">${head1}</span><span class="col-span-2">${head2}</span><span class="col-span-3">Note</span><span class="col-span-2">Valid</span>
              </div>
              ${setsHtml}
            </div>
          </div>`;
      });
      container.innerHTML = html;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function getSavedLogs(exId) {
      const data = localStorage.getItem(`fitapp_log_${currentUser}_${exId}`);
      return data ? JSON.parse(data) : {};
    }

    function sendToGoogleSheets(payload) {
      fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .catch(err => console.error("Erreur Sync:", err));
    }

    function toggleSetDone(exId, exName, setIdx, restSec) {
      const saved = getSavedLogs(exId);
      if (!saved.sets) saved.sets = {};
      const wEl = document.getElementById(`weight-${exId}-${setIdx}`);
      const rEl = document.getElementById(`reps-${exId}-${setIdx}`);
      const cEl = document.getElementById(`comment-${exId}-${setIdx}`);
      const nextDone = (saved.sets[setIdx]?.done !== true);

      saved.sets[setIdx] = { weight: wEl.value, reps: rEl.value, comment: cEl.value, done: nextDone };
      localStorage.setItem(`fitapp_log_${currentUser}_${exId}`, JSON.stringify(saved));

      if (nextDone) {
        showToast("Enregistré !", "success");
        sendToGoogleSheets({ action: "CHECK", user: currentUser, session: sessionsList[activeSessionIndex].title, exercise: exName, set: setIdx + 1, weight: wEl.value, reps: rEl.value, comments: cEl.value });
        if (restSec > 0) { setTimerPreset(restSec); startRestTimer(); }
      } else {
        showToast("Série annulée !");
        sendToGoogleSheets({ action: "UNCHECK", user: currentUser, session: sessionsList[activeSessionIndex].title, exercise: exName, set: setIdx + 1 });
      }
      loadSession(activeSessionIndex);
    }

    function setTimerPreset(sec) { restTimeTotal = sec; restTimeRemaining = sec; updateTimerDisplay(); }
    function updateTimerDisplay() {
      const mins = Math.floor(restTimeRemaining / 60), secs = restTimeRemaining % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    function toggleRestTimer() { if (isRestTimerRunning) pauseRestTimer(); else startRestTimer(); }
    function startRestTimer() {
      if (isRestTimerRunning) clearInterval(restTimerInterval);
      isRestTimerRunning = true;
      document.getElementById('timer-toggle-btn').innerHTML = '<i data-lucide="pause" class="w-5 h-5"></i>'; 
      if (typeof lucide !== 'undefined') lucide.createIcons();
      restTimerInterval = setInterval(() => {
        if (restTimeRemaining > 0) { restTimeRemaining--; updateTimerDisplay(); } else { pauseRestTimer(); }
      }, 1000);
    }
    function pauseRestTimer() { isRestTimerRunning = false; clearInterval(restTimerInterval); document.getElementById('timer-toggle-btn').innerHTML = '<i data-lucide="play" class="w-5 h-5"></i>'; if (typeof lucide !== 'undefined') lucide.createIcons(); }
    function resetRestTimer() { pauseRestTimer(); restTimeRemaining = restTimeTotal; updateTimerDisplay(); }
  </script>
</body>
</html>
