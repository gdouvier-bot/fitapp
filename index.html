<!DOCTYPE html>
<html lang="fr" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitApp Pro</title>
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; user-select: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .active-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.35); }
    @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-toast { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden relative">

  <!-- Toasts -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-11/12 max-w-sm"></div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-slate-950 border border-blue-500/40 flex items-center justify-center p-1.5 shadow-lg active-glow">
        <svg viewBox="0 0 100 100" class="w-full h-full"><path d="M30 30 h10 v40 h-10 z M60 30 h10 v40 h-10 z M20 40 h10 v20 h-10 z M70 40 h10 v20 h-10 z M40 46 h20 v8 h-20 z" fill="#2563eb"/><circle cx="50" cy="50" r="6" fill="#10b981"/></svg>
      </div>
      <div>
        <h1 class="font-extrabold text-sm text-white">FITAPP PRO</h1>
        <select id="user-select" onchange="changeUser(this.value)" class="bg-slate-950 border border-slate-700 text-blue-400 text-[11px] font-bold rounded px-2 py-0.5 mt-0.5 shadow-sm">
          <option value="">Chargement...</option>
        </select>
      </div>
    </div>
    <button onclick="fetchSheetData()" id="sync-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-1.5 border border-slate-700 transition">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> <span>Sync</span>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">
    <!-- Onglets Séances -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Programme Semaine</h2>
      </div>
      <div class="grid grid-cols-2 gap-2" id="session-tabs"></div>
    </section>

    <!-- Minuteur -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
          <i data-lucide="timer" class="w-4 h-4 text-blue-400"></i>
          <h3 class="font-bold text-sm text-white">Minuteur</h3>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="setTimerPreset(45)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">45s</button>
          <button onclick="setTimerPreset(60)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">60s</button>
          <button onclick="setTimerPreset(90)" class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">90s</button>
        </div>
      </div>
      <div class="flex items-center justify-between bg-slate-950/80 rounded-xl p-3 border border-slate-800">
        <span id="timer-display" class="font-mono font-black text-xl text-white">01:30</span>
        <div class="flex items-center space-x-2">
          <button id="timer-toggle-btn" onclick="toggleRestTimer()" class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-lg"><i data-lucide="play" class="w-5 h-5"></i></button>
          <button onclick="resetRestTimer()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
        </div>
      </div>
    </section>

    <!-- Liste d'exercices -->
    <section class="space-y-3" id="exercise-container">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span id="session-badge" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
          <h2 id="session-title" class="font-black text-lg text-white">Aucune séance</h2>
        </div>
      </div>
      <div id="exercise-list" class="space-y-4"></div>
    </section>
  </main>

  <script>
    // URL DE TON SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEPjmC8hhvVwvTajH7d6tC8bbCpgQS5nptCY25U7Ty3D8d1v5ZQxHQpuUFfBKTSz26/exec";
    
    let currentUser = localStorage.getItem('fitapp_user') || "";
    let rawExercises = JSON.parse(localStorage.getItem('fitapp_raw_exercises')) || [];
    let allUsers = JSON.parse(localStorage.getItem('fitapp_all_users')) || [];
    let sessionsList = [];
    let activeSessionIndex = null;
    let restTimeTotal = 90, restTimeRemaining = 90, restTimerInterval = null, isRestTimerRunning = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      if (allUsers.length > 0 && rawExercises.length > 0) {
        populateUserSelect(allUsers);
        buildProgramForCurrentUser();
      }
      fetchSheetData();
    });

    function showToast(msg, type="info") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const color = type === "error" ? "bg-red-600 border-red-500" : type === "success" ? "bg-emerald-600 border-emerald-500" : "bg-slate-800 border-slate-700";
      toast.className = `${color} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-toast`;
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // CHARGEMENT VIA JSONP (Anti-CORS)
    function fetchSheetData() {
      const btn = document.getElementById('sync-btn');
      if (btn) btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const script = document.createElement('script');
      script.src = GOOGLE_SCRIPT_URL + "?callback=onGoogleDataLoaded&t=" + Date.now();
      document.body.appendChild(script);
      
      script.onload = () => script.remove();
      script.onerror = () => {
         if (btn) btn.innerHTML = `<i data-lucide="wifi-off" class="w-3.5 h-3.5 text-red-400"></i>`;
         alert("Impossible de joindre Google Sheets. Assure-toi que la web app est publiée en 'N'importe qui'.");
      };
    }

    function onGoogleDataLoaded(data) {
      const btn = document.getElementById('sync-btn');
      if (btn) btn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> <span>Sync</span>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();

      if (data.error) {
        alert("Erreur retournée par Google : " + data.error);
        return;
      }

      allUsers = data.users || [];
      rawExercises = data.exercises || [];
      localStorage.setItem('fitapp_all_users', JSON.stringify(allUsers));
      localStorage.setItem('fitapp_raw_exercises', JSON.stringify(rawExercises));

      populateUserSelect(allUsers);
      buildProgramForCurrentUser();
      showToast("Synchronisation réussie !", "success");
    }

    function populateUserSelect(users) {
      const select = document.getElementById('user-select');
      if (users.length === 0) users = ["Doudou"];
      
      select.innerHTML = users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
      
      if (!currentUser || !users.includes(currentUser)) {
        currentUser = users[0];
        localStorage.setItem('fitapp_user', currentUser);
      }
    }

    function changeUser(user) {
      currentUser = user;
      localStorage.setItem('fitapp_user', currentUser);
      buildProgramForCurrentUser();
      showToast(`Profil chargé : ${currentUser}`);
    }

    function buildProgramForCurrentUser() {
      const userEx = rawExercises.filter(e => e.user.toLowerCase() === currentUser.toLowerCase());
      
      const grouped = {};
      userEx.forEach(ex => {
        if (!grouped[ex.seance]) grouped[ex.seance] = [];
        grouped[ex.seance].push(ex);
      });

      sessionsList = Object.keys(grouped).map((seanceName, idx) => ({
        id: "s" + idx,
        title: seanceName,
        exercises: grouped[seanceName]
      }));

      renderTabs();
      
      if (sessionsList.length > 0) {
        switchSession(activeSessionIndex !== null && activeSessionIndex < sessionsList.length ? activeSessionIndex : 0);
      } else {
        document.getElementById('session-title').innerText = "Aucun programme";
        document.getElementById('exercise-list').innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-md">
            <p class="text-xs text-slate-400 font-bold mb-2">Aucun exercice trouvé !</p>
            <p class="text-[10px] text-slate-500">Ajoute des lignes dans ton Google Sheet pour <b>${currentUser}</b> puis clique sur Sync.</p>
          </div>`;
      }
    }

    function renderTabs() {
      const container = document.getElementById('session-tabs');
      container.innerHTML = sessionsList.map((s, idx) => `
        <button onclick="switchSession(${idx})" class="text-left p-3 rounded-xl border transition-all flex flex-col justify-between ${idx === activeSessionIndex ? 'bg-slate-900 border-blue-500/80 active-glow' : 'bg-slate-900/60 border-slate-800'}">
          <div class="font-bold text-xs text-white truncate">${s.title.replace(currentUser + " - ", "")}</div>
        </button>
      `).join('');
    }

    function switchSession(idx) {
      activeSessionIndex = idx;
      renderTabs();
      loadSession(idx);
    }

    function loadSession(idx) {
      const session = sessionsList[idx];
      if (!session) return;
      document.getElementById('session-title').innerText = session.title;
      const container = document.getElementById('exercise-list');
      
      let html = '';
      session.exercises.forEach((ex) => {
        const savedData = getSavedLogs(ex.id);
        const safeName = ex.name.replace(/'/g, "\\'"); 
        
        let head1 = "Poids", head2 = "Reps", ph1 = "kg", ph2 = "reps";
        const exType = (ex.type || "Poids").toLowerCase();

        if (exType.includes("durée") || exType.includes("temps")) {
          head1 = "Temps"; ph1 = "min:sec";
          head2 = "Dist."; ph2 = "km/m";
        } else if (exType === "km" || exType.includes("distance")) {
          head1 = "Dist."; ph1 = "km";
          head2 = "Temps"; ph2 = "min:sec";
        } else if (exType === "pdc" || exType.includes("corps")) {
          head1 = "Lest";  ph1 = "+kg";
          head2 = "Reps";  ph2 = "reps";
        }

        let setsHtml = '';
        for (let setIdx = 0; setIdx < ex.sets; setIdx++) {
          const setLog = (savedData.sets && savedData.sets[setIdx]) ? savedData.sets[setIdx] : {};
          const isDone = (setLog.done === true);
          
          const disabledAttr = isDone ? 'disabled' : '';
          const disClass = isDone ? 'opacity-50 bg-slate-950 border-slate-800' : 'bg-slate-900 border-slate-700 focus:border-blue-500';
          const btnClass = isDone ? 'bg-emerald-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 hover:text-slate-200';
          
          const val1 = setLog.weight || '';
          const val2 = setLog.reps || (exType === "poids" || exType === "pdc" ? ex.reps : ''); 
          const commentVal = setLog.comment || '';

          setsHtml += `
            <div class="grid grid-cols-12 gap-1.5 items-center bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
              <span class="col-span-2 text-center text-xs font-bold text-slate-400">#${setIdx + 1}</span>
              <div class="col-span-3">
                <input type="text" inputmode="decimal" id="weight-${ex.id}-${setIdx}" value="${val1}" placeholder="${ph1}" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1 py-1 text-center outline-none border transition ${disClass}">
              </div>
              <div class="col-span-2">
                <input type="text" inputmode="decimal" id="reps-${ex.id}-${setIdx}" value="${val2}" placeholder="${ph2}" ${disabledAttr} class="w-full text-white text-xs font-mono rounded-lg px-1 py-1 text-center outline-none border transition ${disClass}">
              </div>
              <div class="col-span-3">
                <input type="text" id="comment-${ex.id}-${setIdx}" value="${commentVal}" placeholder="Note" ${disabledAttr} class="w-full text-slate-300 text-[10px] rounded-lg px-1 py-1 outline-none border transition ${disClass}">
              </div>
              <div class="col-span-2 flex justify-center">
                <button onclick="toggleSetDone('${ex.id}', '${safeName}', ${setIdx}, ${ex.restSec})" class="w-7 h-7 rounded-lg flex items-center justify-center font-bold transition ${btnClass}">✓</button>
              </div>
            </div>`;
        }

        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-md">
            <div>
              <div class="flex justify-between items-start">
                <h3 class="font-black text-base text-white">${ex.name}</h3>
                <span class="text-[9px] font-bold uppercase tracking-wider bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${ex.type || 'Poids'}</span>
              </div>
              <p class="text-xs text-blue-400 font-medium mt-0.5">${ex.sets} séries • Pause: ${ex.restSec}s</p>
            </div>
            <div class="space-y-2 pt-1">
              <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center px-1">
                <span class="col-span-2">Série</span><span class="col-span-3">${head1}</span><span class="col-span-2">${head2}</span><span class="col-span-3">Note</span><span class="col-span-2">Valid</span>
              </div>
              ${setsHtml}
            </div>
          </div>`;
      });
      
      container.innerHTML = html;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function getSavedLogs(exId) {
      const data = localStorage.getItem(`fitapp_log_${currentUser}_${exId}`);
      return data ? JSON.parse(data) : {};
    }

    function sendToGoogleSheets(payload) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Erreur Sync:", err));
    }

    function toggleSetDone(exId, exName, setIdx, restSec) {
      const saved = getSavedLogs(exId);
      if (!saved.sets) saved.sets = {};
      
      const wEl = document.getElementById(`weight-${exId}-${setIdx}`);
      const rEl = document.getElementById(`reps-${exId}-${setIdx}`);
      const cEl = document.getElementById(`comment-${exId}-${setIdx}`);
      const nextDone = (saved.sets[setIdx]?.done !== true);

      saved.sets[setIdx] = { weight: wEl.value, reps: rEl.value, comment: cEl.value, done: nextDone };
      localStorage.setItem(`fitapp_log_${currentUser}_${exId}`, JSON.stringify(saved));

      if (nextDone) {
        showToast("Série enregistrée !", "success");
        sendToGoogleSheets({ action: "CHECK", user: currentUser, session: sessionsList[activeSessionIndex].title, exercise: exName, set: setIdx + 1, weight: wEl.value, reps: rEl.value, comments: cEl.value });
        if (restSec > 0) { setTimerPreset(restSec); startRestTimer(); }
      } else {
        showToast("Série annulée !");
        sendToGoogleSheets({ action: "UNCHECK", user: currentUser, session: sessionsList[activeSessionIndex].title, exercise: exName, set: setIdx + 1 });
      }
      loadSession(activeSessionIndex);
    }

    function setTimerPreset(sec) { restTimeTotal = sec; restTimeRemaining = sec; updateTimerDisplay(); }
    function updateTimerDisplay() {
      const mins = Math.floor(restTimeRemaining / 60), secs = restTimeRemaining % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    function toggleRestTimer() { if (isRestTimerRunning) pauseRestTimer(); else startRestTimer(); }
    function startRestTimer() {
      if (isRestTimerRunning) clearInterval(restTimerInterval);
      isRestTimerRunning = true;
      document.getElementById('timer-toggle-btn').innerHTML = '<i data-lucide="pause" class="w-5 h-5"></i>'; 
      if (typeof lucide !== 'undefined') lucide.createIcons();
      restTimerInterval = setInterval(() => {
        if (restTimeRemaining > 0) { restTimeRemaining--; updateTimerDisplay(); } else { pauseRestTimer(); }
      }, 1000);
    }
    function pauseRestTimer() { 
      isRestTimerRunning = false; clearInterval(restTimerInterval); 
      document.getElementById('timer-toggle-btn').innerHTML = '<i data-lucide="play" class="w-5 h-5"></i>'; 
      if (typeof lucide !== 'undefined') lucide.createIcons(); 
    }
    function resetRestTimer() { pauseRestTimer(); restTimeRemaining = restTimeTotal; updateTimerDisplay(); }
  </script>
</body>
</html>
